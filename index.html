<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Powers 2048</title>
<style>
:root{
  --bg:#faf8f3;--panel:#ffffff;--ink:#2b2a33;--muted:#6b6878;
  --board:#cfc7b8;--cell:#e6e0d4;--accent:#5b4bd6;--accent-ink:#fff;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#17161c;--panel:#221f2b;--ink:#ece9f5;--muted:#a19cb3;
  --board:#2f2b3a;--cell:#3b3649;--accent:#9d90ff;--accent-ink:#17161c;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:540px;margin:0 auto;padding:16px;}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;}
h1{font-size:1.6rem;margin:0;letter-spacing:-.02em}
h1 sup{font-size:.6em;color:var(--accent)}
.lang{background:none;border:1px solid var(--muted);color:var(--ink);
  border-radius:8px;padding:4px 10px;cursor:pointer;font-weight:600}
.rule{color:var(--muted);margin:6px 0 12px;font-size:.95rem}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.controls label{display:flex;flex-direction:column;font-size:.75rem;color:var(--muted);gap:4px}
select{font:inherit;font-size:.95rem;padding:6px;border-radius:8px;
  border:1px solid var(--board);background:var(--panel);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border-radius:10px;padding:8px;text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat small{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:1.15rem}
.board-wrap{position:relative}
.board{--n:4;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;
  background:var(--board);padding:8px;border-radius:12px;width:100%;
  grid-template-rows:repeat(var(--n),1fr);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cell{background:var(--cell);border-radius:8px;position:relative;min-width:0;min-height:0}
.tile{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:800;line-height:1}
.tile sup{font-size:.55em;margin-left:.04em}
.tile .val{font-weight:600;opacity:.85;margin-top:.25em}
.tile.new{animation:appear .18s ease-out}
.tile.merged{animation:pop .22s ease-out}
@keyframes appear{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:12px;background:rgba(20,18,28,.7);
  color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  font-size:1.5rem;font-weight:800;text-align:center;padding:16px}
.overlay.show{display:flex}
.btn{touch-action:manipulation;-webkit-appearance:none;font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;
  background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--board)}
.btn:disabled{opacity:.4;cursor:default}
.actions{display:flex;gap:8px;margin:12px 0}
.actions .btn{flex:1}
.eqbox{background:var(--panel);border-radius:12px;padding:12px 14px;min-height:96px;
  box-shadow:0 1px 3px rgba(0,0,0,.08)}
.eqbox h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px}
.eq{font-size:1.25rem;font-weight:700;overflow-wrap:anywhere}
.eq2,.eq3{color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.eq b{color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,48px);
  gap:6px;justify-content:center;margin:14px 0 4px}
.pad button{font-size:1.3rem;touch-action:manipulation;border-radius:10px;border:1px solid var(--board);
  background:var(--panel);color:var(--ink);cursor:pointer}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}
.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.hint{color:var(--muted);font-size:.8rem;text-align:center}

.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:1rem;margin-left:auto;margin-right:10px}
.quiz{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,18,28,.78);display:none;
  align-items:center;justify-content:center;padding:16px;z-index:10}
.quiz.show{display:flex}
.qcard{background:var(--panel);color:var(--ink);border-radius:16px;padding:20px;width:100%;max-width:460px;
  box-shadow:0 10px 40px rgba(0,0,0,.3)}
.qhead{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;margin-bottom:10px}
.dots{display:flex;gap:6px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--cell);border:2px solid var(--board);transition:background .2s}
.dot.on{background:var(--accent);border-color:var(--accent)}
.qhead .lang{margin-left:auto}
.qintro{color:var(--muted);font-size:.95rem;margin:0 0 14px}
.qtext{font-size:1rem;color:var(--muted)}
.qexpr{font-size:2.2rem;font-weight:800;margin:6px 0 18px;text-align:center}
.qexpr sup,.opt sup,.qfeed sup{font-size:.6em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;font-size:1.6rem;font-weight:700;padding:14px 8px;border-radius:12px;border:2px solid var(--board);
  background:var(--bg);color:var(--ink);cursor:pointer;touch-action:manipulation;-webkit-appearance:none}
.opt.right{background:#2e9e5b;border-color:#2e9e5b;color:#fff}
.opt.wrong{background:#d64545;border-color:#d64545;color:#fff}
.qfeed{min-height:1.4em;margin-top:14px;font-size:1rem;font-weight:600}
.qfeed .rule{display:block;font-weight:400;color:var(--muted);margin-top:6px;font-size:1.05rem}
.qnext{width:100%;margin-top:14px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Powers 2048</h1>
    <span class="timer" id="timer"></span>
    <button class="lang" id="langBtn">PL</button>
  </header>
  <p class="rule" id="rule"></p>

  <div class="controls">
    <label><span id="lBase"></span>
      <select id="selBase">
        <option value="2">2</option><option value="3">3</option>
        <option value="4">4</option><option value="5">5</option>
      </select></label>
    <label><span id="lSize"></span>
      <select id="selSize">
        <option value="4">4 × 4</option><option value="5">5 × 5</option><option value="6">6 × 6</option><option value="7">7 × 7</option>
      </select></label>
    <label><span id="lMode"></span>
      <select id="selMode">
        <option value="pow"></option><option value="val"></option><option value="both"></option>
      </select></label>
  </div>

  <div class="stats">
    <div class="stat"><small id="lScore"></small><b id="score">0</b></div>
    <div class="stat"><small id="lMax"></small><b id="maxTile">–</b></div>
    <div class="stat"><small id="lBest"></small><b id="best">–</b></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <div id="overText"></div>
      <button class="btn" id="againBtn"></button>
    </div>
  </div>

  <div class="actions">
    <button class="btn ghost" id="undoBtn"></button>
    <button class="btn" id="newBtn"></button>
  </div>

  <div class="eqbox">
    <h2 id="lEq"></h2>
    <div id="eq"></div>
  </div>

  <div class="pad">
    <button class="up" data-dir="up" aria-label="up">▲</button>
    <button class="left" data-dir="left" aria-label="left">◀</button>
    <button class="down" data-dir="down" aria-label="down">▼</button>
    <button class="right" data-dir="right" aria-label="right">▶</button>
  </div>
  <p class="hint" id="hint"></p>
</div>

<div class="quiz" id="quiz">
  <div class="qcard">
    <div class="qhead">
      <span id="qStreakLbl"></span>
      <div class="dots" id="dots"></div>
      <button class="lang" id="qLang"></button>
    </div>
    <p class="qintro" id="qIntro"></p>
    <div class="qtext" id="qText"></div>
    <div class="qexpr" id="qExpr"></div>
    <div class="opts" id="opts"></div>
    <div class="qfeed" id="qFeed"></div>
    <button class="btn qnext" id="qNext"></button>
  </div>
</div>

<script>
// show any script error on the page (helps debugging on iPad)
window.addEventListener('error', function (e) {
  var d = document.createElement('pre');
  d.style.cssText = 'white-space:pre-wrap;color:#b00;background:#fee;padding:8px;font-size:12px';
  d.textContent = 'Error: ' + e.message + ' (line ' + e.lineno + ')';
  document.body.insertBefore(d, document.body.firstChild);
});
const T = {
  pl: {
    title: 'Potęgi 2048', base: 'Podstawa', size: 'Plansza', mode: 'Wyświetlanie',
    pow: 'potęga', val: 'wartość', both: 'oba',
    score: 'Wynik', max: 'Najwyższy', best: 'Rekord',
    undo: '↶ Cofnij', newGame: 'Nowa gra', again: 'Zagraj jeszcze raz',
    over: 'Koniec gry!', lastEq: 'Ostatnie połączenie',
    placeholder: 'Połącz kafelki – tutaj pojawi się działanie.',
    rule: b => `Zasada: ${b} jednakowe kafelki w linii łączą się w jeden, którego wykładnik jest większy o 1.`,
    hint: 'Strzałki / WASD, przesunięcie palcem lub przyciski powyżej.',
    qIntro: (k, m) => `Odpowiedz poprawnie ${k} razy z rzędu, aby odblokować ${m} min gry.`,
    timeUp: 'Koniec czasu! Odpowiedz na pytania, aby grać dalej.',
    inARow: 'Z rzędu:', qValue: 'Która potęga jest równa tej liczbie?',
    qLaw: 'Wybierz wyrażenie równe temu:', correct: 'Dobrze!', unlocked: 'Odblokowane! 🎉',
    wrongAns: 'Niestety. Poprawna odpowiedź:', next: 'Dalej', play: 'Graj ▶',
    ruleVal: 'Policz czynniki', ruleSame: 'Ta sama podstawa, mnożenie → dodaj wykładniki',
    ruleExp: 'Ten sam wykładnik, mnożenie → pomnóż podstawy', rulePow: 'Potęga potęgi → pomnóż wykładniki'
  },
  en: {
    title: 'Powers 2048', base: 'Base', size: 'Board', mode: 'Display',
    pow: 'power', val: 'value', both: 'both',
    score: 'Score', max: 'Highest', best: 'Best',
    undo: '↶ Undo', newGame: 'New game', again: 'Play again',
    over: 'Game over!', lastEq: 'Last merge',
    placeholder: 'Merge some tiles – the calculation will appear here.',
    rule: b => `Rule: ${b} identical tiles in a line merge into one tile whose exponent is 1 higher.`,
    hint: 'Arrow keys / WASD, swipe, or the buttons above.',
    qIntro: (k, m) => `Answer ${k} questions in a row correctly to unlock ${m} min of play.`,
    timeUp: "Time's up! Answer the questions to keep playing.",
    inARow: 'In a row:', qValue: 'Which power equals this number?',
    qLaw: 'Choose the expression equal to:', correct: 'Correct!', unlocked: 'Unlocked! 🎉',
    wrongAns: 'Not quite. Correct answer:', next: 'Next', play: 'Play ▶',
    ruleVal: 'Count the factors', ruleSame: 'Same base, multiplying → add the exponents',
    ruleExp: 'Same exponent, multiplying → multiply the bases', rulePow: 'Power of a power → multiply the exponents'
  }
};
const DEFAULT_SIZE = {2: 5, 3: 6, 4: 7, 5: 7};

let base = 3, n = 6, mode = 'both', lang = 'en';
let grid = [], score = 0, over = false, lastEq = null, undoState = null;

const $ = id => document.getElementById(id);
const board = $('board');

/* ---------- URL & storage ---------- */
function readParams() {
  const p = new URLSearchParams(location.search);
  const b = parseInt(p.get('base'), 10);
  if ([2, 3, 4, 5].includes(b)) base = b;
  const s = parseInt(p.get('size'), 10);
  n = [4, 5, 6, 7].includes(s) ? s : DEFAULT_SIZE[base];
  if (['pow', 'val', 'both'].includes(p.get('mode'))) mode = p.get('mode');
  if (['pl', 'en'].includes(p.get('lang'))) lang = p.get('lang');
}
function writeParams() {
  const p = new URLSearchParams({base, size: n, mode, lang});
  try { history.replaceState(null, '', '?' + p.toString()); } catch (e) {}
}
const bestKey = () => `pot2048-best-${base}-${n}`;
function loadBest() {
  try { return JSON.parse(localStorage.getItem(bestKey())) || {score: 0, exp: 0}; }
  catch (e) { return {score: 0, exp: 0}; }
}
function saveBest(b) {
  try { localStorage.setItem(bestKey(), JSON.stringify(b)); } catch (e) {}
}

/* ---------- helpers ---------- */
const pw = (b, e) => `${b}<sup>${e}</sup>`;
const fmt = v => v.toLocaleString(lang === 'pl' ? 'pl-PL' : 'en-GB');
const valOf = e => Math.pow(base, e);

/* ---------- game logic ---------- */
function newGame() {
  grid = Array(n * n).fill(0);
  score = 0; over = false; lastEq = null; undoState = null;
  const a = spawn(), b = spawn();
  render(new Set(), new Set([a, b]));
}
function spawn() {
  const empty = [];
  grid.forEach((v, i) => { if (!v) empty.push(i); });
  if (!empty.length) return -1;
  const i = empty[Math.floor(Math.random() * empty.length)];
  grid[i] = Math.random() < 0.9 ? 1 : 2;
  return i;
}
// indices of line k, ordered from the side tiles move towards
function lineIdx(dir, k) {
  const idx = [];
  for (let j = 0; j < n; j++) {
    if (dir === 'left') idx.push(k * n + j);
    else if (dir === 'right') idx.push(k * n + (n - 1 - j));
    else if (dir === 'up') idx.push(j * n + k);
    else idx.push((n - 1 - j) * n + k);
  }
  return idx;
}
function slide(line) {
  const t = line.filter(v => v);
  const out = [], merges = [];
  let i = 0, gained = 0;
  while (i < t.length) {
    let ok = i + base <= t.length;
    if (ok) for (let m = 1; m < base; m++) if (t[i + m] !== t[i]) { ok = false; break; }
    if (ok) {
      out.push(t[i] + 1);
      merges.push({e: t[i], pos: out.length - 1});
      gained += valOf(t[i] + 1);
      i += base;
    } else { out.push(t[i]); i++; }
  }
  while (out.length < n) out.push(0);
  return {out, merges, gained};
}
function canMove() {
  if (grid.includes(0)) return true;
  for (const d of ['left', 'up']) {
    for (let k = 0; k < n; k++) {
      if (slide(lineIdx(d, k).map(i => grid[i])).merges.length) return true;
    }
  }
  return false;
}
function move(dir) {
  if (over || locked) return;
  const ng = grid.slice();
  const mergedCells = new Set();
  let gained = 0, top = null;
  for (let k = 0; k < n; k++) {
    const idx = lineIdx(dir, k);
    const r = slide(idx.map(i => grid[i]));
    idx.forEach((i, j) => { ng[i] = r.out[j]; });
    r.merges.forEach(m => {
      mergedCells.add(idx[m.pos]);
      if (top === null || m.e > top) top = m.e;
    });
    gained += r.gained;
  }
  if (ng.every((v, i) => v === grid[i])) return; // nothing moved
  undoState = {grid: grid.slice(), score, lastEq};
  grid = ng; score += gained;
  if (top !== null) lastEq = top;
  const s = spawn();
  if (!canMove()) over = true;
  render(mergedCells, new Set([s]));
}
function undo() {
  if (!undoState) return;
  grid = undoState.grid; score = undoState.score; lastEq = undoState.lastEq;
  undoState = null; over = false;
  render();
}

/* ---------- rendering ---------- */
function tileColor(e) {
  const hue = (35 + e * 38) % 360;
  const light = Math.max(38, 86 - e * 6);
  return {bg: `hsl(${hue} 70% ${light}%)`, fg: light < 62 ? '#fff' : '#2b2a33'};
}
function tileHTML(e, cell) {
  const v = fmt(valOf(e));
  const digits = String(valOf(e)).length;
  if (mode === 'pow') return {html: pw(base, e), fs: cell * 0.38};
  if (mode === 'val') return {html: v, fs: cell * Math.min(0.42, 1.1 / (digits + 0.6))};
  const big = cell * Math.min(0.36, 1.0 / (digits + 0.8));
  return {html: `<div>${v}</div><div class="val" style="font-size:${cell * 0.2}px">${pw(base, e)}</div>`, fs: big};
}
function eqHTML(e) {
  const terms = Array(base).fill(pw(base, e)).join(' + ');
  const vals = Array(base).fill(fmt(valOf(e))).join(' + ');
  return `<div class="eq">${terms} = <b>${pw(base, e + 1)}</b></div>` +
         `<div class="eq2">${pw(base, 1)} · ${pw(base, e)} = ${pw(base, '1+' + e)} = ${pw(base, e + 1)}</div>` +
         `<div class="eq3">${vals} = ${fmt(valOf(e + 1))}</div>`;
}
function render(merged = new Set(), fresh = new Set()) {
  board.style.setProperty('--n', n);
  board.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
  board.style.gridTemplateRows = 'repeat(' + n + ', 1fr)';
  board.innerHTML = '';
  const w = board.getBoundingClientRect().width || Math.min(508, window.innerWidth - 32);
  board.style.height = w + 'px';
  const cell = (w - 16 - 8 * (n - 1)) / n;
  grid.forEach((e, i) => {
    const c = document.createElement('div');
    c.className = 'cell';
    if (e) {
      const t = document.createElement('div');
      const col = tileColor(e);
      const h = tileHTML(e, cell);
      t.className = 'tile' + (merged.has(i) ? ' merged' : '') + (fresh.has(i) ? ' new' : '');
      t.style.background = col.bg; t.style.color = col.fg; t.style.fontSize = h.fs + 'px';
      t.innerHTML = h.html;
      c.appendChild(t);
    }
    board.appendChild(c);
  });

  const maxE = Math.max(0, ...grid);
  const best = loadBest();
  if (score > best.score || maxE > best.exp) {
    best.score = Math.max(best.score, score);
    best.exp = Math.max(best.exp, maxE);
    saveBest(best);
  }
  $('score').textContent = fmt(score);
  $('maxTile').innerHTML = maxE ? pw(base, maxE) : '–';
  $('best').innerHTML = best.exp ? `${pw(base, best.exp)} · ${fmt(best.score)}` : '–';
  $('eq').innerHTML = lastEq === null ? `<div class="eq3">${T[lang].placeholder}</div>` : eqHTML(lastEq);
  $('undoBtn').disabled = !undoState;
  $('overlay').classList.toggle('show', over);
}
function applyLang() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  $('title').innerHTML = lang === 'pl' ? 'Potęgi 2<sup>11</sup>' : 'Powers 2<sup>11</sup>';
  $('langBtn').textContent = lang === 'pl' ? 'EN' : 'PL';
  $('rule').textContent = t.rule(base);
  $('lBase').textContent = t.base; $('lSize').textContent = t.size; $('lMode').textContent = t.mode;
  const opts = $('selMode').options;
  opts[0].text = t.pow; opts[1].text = t.val; opts[2].text = t.both;
  $('lScore').textContent = t.score; $('lMax').textContent = t.max; $('lBest').textContent = t.best;
  $('undoBtn').textContent = t.undo; $('newBtn').textContent = t.newGame;
  $('againBtn').textContent = t.again; $('overText').textContent = t.over;
  $('lEq').textContent = t.lastEq; $('hint').textContent = t.hint;
  if (typeof renderQuizText === 'function') { renderQuizText(); updateTimer(); }
}
function syncSelects() {
  $('selBase').value = base; $('selSize').value = n; $('selMode').value = mode;
}

/* ---------- input ---------- */
const KEYS = {ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
  a: 'left', d: 'right', w: 'up', s: 'down', A: 'left', D: 'right', W: 'up', S: 'down'};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const dir = KEYS[e.key];
  if (dir) { e.preventDefault(); move(dir); }
});
let start = null;
function swipeEnd(x, y) {
  if (!start) return;
  const dx = x - start.x, dy = y - start.y;
  start = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
}
if ('ontouchstart' in window) {
  // iOS Safari: plain touch events are the most reliable
  board.addEventListener('touchstart', e => {
    const t = e.touches[0]; start = {x: t.clientX, y: t.clientY};
  }, {passive: true});
  board.addEventListener('touchmove', e => { e.preventDefault(); }, {passive: false});
  board.addEventListener('touchend', e => {
    const t = e.changedTouches[0]; swipeEnd(t.clientX, t.clientY);
  });
  board.addEventListener('touchcancel', () => { start = null; });
} else {
  board.addEventListener('mousedown', e => { start = {x: e.clientX, y: e.clientY}; });
  window.addEventListener('mouseup', e => swipeEnd(e.clientX, e.clientY));
}
document.querySelectorAll('.pad button').forEach(b => b.addEventListener('click', () => move(b.dataset.dir)));

$('selBase').addEventListener('change', e => {
  base = +e.target.value; n = DEFAULT_SIZE[base];
  syncSelects(); applyLang(); writeParams(); newGame(); e.target.blur();
});
$('selSize').addEventListener('change', e => { n = +e.target.value; writeParams(); newGame(); e.target.blur(); });
$('selMode').addEventListener('change', e => { mode = e.target.value; writeParams(); render(); e.target.blur(); });
$('langBtn').addEventListener('click', () => { lang = lang === 'pl' ? 'en' : 'pl'; applyLang(); writeParams(); render(); });
$('newBtn').addEventListener('click', newGame);
$('againBtn').addEventListener('click', newGame);
$('undoBtn').addEventListener('click', undo);
window.addEventListener('resize', () => render());

/* ---------- quiz gate ---------- */
const PLAY_SECONDS = 180;  // play time after each unlock (seconds)
const NEED = 3;            // correct answers in a row needed to unlock
let locked = true, playLeft = PLAY_SECONDS, streak = 0, curQ = null, answered = false;
let firstQuiz = true, lastExpr = '';

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const x = arr[i]; arr[i] = arr[j]; arr[j] = x; } return arr; };
const P = (b, e) => `${b}<sup>${e}</sup>`;

// 1) number -> which power?
function qValue() {
  const pairs = [];
  for (let b = 2; b <= 10; b++) for (let e = 2; e <= 10; e++) {
    const v = Math.pow(b, e);
    if (v <= 1000 || (b === 10 && e <= 6)) pairs.push([b, e]);
  }
  const [b, e] = pick(pairs);
  const v = Math.pow(b, e);
  const cands = [];
  // typical mistake: thinking "base × exponent = number" (27 -> 9^3, 3^9)
  for (let x = 2; x <= Math.min(v / 2, 50); x++) if (v % x === 0) { const y = v / x; if (y >= 2 && y <= 12) cands.push([x, y]); }
  cands.push([b, e + 1], [b, e - 1], [e, b]);
  const seen = new Set([b + '^' + e]), wrong = [];
  shuffle(cands).forEach(([x, y]) => {
    const k = x + '^' + y;
    if (wrong.length >= 3 || seen.has(k) || Math.pow(x, y) === v) return;
    seen.add(k); wrong.push(P(x, y));
  });
  for (let k = 2; wrong.length < 3; k++) wrong.push(P(b, e + k));
  return {kind: 'qValue', expr: fmt(v), right: P(b, e), wrong,
    rule: 'ruleVal', ruleExpr: `${fmt(v)} = ${Array(e).fill(b).join(' · ')} = ${P(b, e)}`};
}
// 2) a^m · a^n
function qSameBase() {
  const a = rnd(2, 7), m = rnd(2, 6); let n = rnd(2, 6);
  if (m === 2 && n === 2) n = 3;
  return {kind: 'qLaw', expr: `${P(a, m)} · ${P(a, n)}`, right: P(a, m + n),
    wrong: [P(a, m * n), P(a * a, m + n), P(a * a, m * n)],
    rule: 'ruleSame', ruleExpr: `${P(a, m)} · ${P(a, n)} = ${P(a, m + '+' + n)} = ${P(a, m + n)}`};
}
// 3) a^n · b^n
function qSameExp() {
  const a = rnd(2, 5); let b = rnd(2, 5); if (a === b) b = a === 5 ? 2 : a + 1;
  const n = rnd(2, 6);
  return {kind: 'qLaw', expr: `${P(a, n)} · ${P(b, n)}`, right: P(a * b, n),
    wrong: [P(a * b, 2 * n), P(a + b, n), P(a + b, 2 * n)],
    rule: 'ruleExp', ruleExpr: `${P(a, n)} · ${P(b, n)} = (${a} · ${b})<sup>${n}</sup> = ${P(a * b, n)}`};
}
// 4) (a^m)^n
function qPowPow() {
  const a = rnd(2, 6), n = rnd(2, 4); let m = rnd(2, 5);
  if (m === 2 && n === 2) m = 3;
  return {kind: 'qLaw', expr: `(${P(a, m)})<sup>${n}</sup>`, right: P(a, m * n),
    // (2^m)^2 really equals 4^m, so use a different trap there
    wrong: [P(a, m + n), P(a, Math.pow(m, n)), (a === 2 && n === 2) ? P(a * m, n) : P(a * n, m)],
    rule: 'rulePow', ruleExpr: `(${P(a, m)})<sup>${n}</sup> = ${P(a, m + '·' + n)} = ${P(a, m * n)}`};
}
// half "number -> power", half the three laws
const GEN = [qValue, qValue, qValue, qSameBase, qSameExp, qPowPow];

function renderDots() {
  $('dots').innerHTML = '';
  for (let i = 0; i < NEED; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < streak ? ' on' : '');
    $('dots').appendChild(d);
  }
}
function renderQuizText() {
  const t = T[lang];
  $('qLang').textContent = lang === 'pl' ? 'EN' : 'PL';
  $('qStreakLbl').textContent = t.inARow;
  $('qIntro').textContent = firstQuiz ? t.qIntro(NEED, Math.round(PLAY_SECONDS / 60)) : t.timeUp;
  if (curQ) $('qText').textContent = t[curQ.kind];
  const fb = $('qFeed').dataset;
  if (fb.state === 'right') $('qFeed').textContent = streak >= NEED ? t.unlocked : t.correct;
  if (fb.state === 'wrong') $('qFeed').innerHTML = `${t.wrongAns} ${curQ.right}<span class="rule">${t[curQ.rule]}:<br>${curQ.ruleExpr}</span>`;
  $('qNext').textContent = streak >= NEED ? t.play : t.next;
}
function openQuiz() {
  locked = true; streak = 0;
  renderDots(); nextQ(); updateTimer();
  $('quiz').classList.add('show');
}
function nextQ() {
  answered = false;
  let q;
  do { q = pick(GEN)(); } while (q.expr === lastExpr);
  lastExpr = q.expr; curQ = q;
  $('qExpr').innerHTML = q.expr;
  $('opts').innerHTML = '';
  shuffle([q.right].concat(q.wrong)).forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt'; b.innerHTML = o;
    b.addEventListener('click', () => answer(b, o));
    $('opts').appendChild(b);
  });
  $('qFeed').textContent = ''; $('qFeed').dataset.state = '';
  $('qNext').style.display = 'none';
  renderQuizText();
}
function answer(btn, o) {
  if (answered) return;
  answered = true;
  const ok = o === curQ.right;
  $('opts').querySelectorAll('.opt').forEach(b => { if (b.innerHTML === curQ.right) b.classList.add('right'); });
  if (ok) {
    streak++;
    $('qFeed').dataset.state = 'right';
    if (streak < NEED) setTimeout(nextQ, 700);
    else $('qNext').style.display = 'block';
  } else {
    streak = 0;
    btn.classList.add('wrong');
    $('qFeed').dataset.state = 'wrong';
    $('qNext').style.display = 'block';
  }
  renderDots(); renderQuizText();
}
function closeQuiz() {
  firstQuiz = false; locked = false; playLeft = PLAY_SECONDS;
  $('quiz').classList.remove('show');
  updateTimer();
}
function updateTimer() {
  const m = Math.floor(playLeft / 60), s = playLeft % 60;
  $('timer').textContent = locked ? '🔒' : `⏱ ${m}:${String(s).padStart(2, '0')}`;
}
$('qNext').addEventListener('click', () => { if (streak >= NEED) closeQuiz(); else nextQ(); });
$('qLang').addEventListener('click', () => $('langBtn').click());
setInterval(() => {
  if (locked || document.hidden) return;
  playLeft--; updateTimer();
  if (playLeft <= 0) openQuiz();
}, 1000);

/* ---------- start ---------- */
readParams(); syncSelects(); applyLang(); newGame(); openQuiz();
</script>
